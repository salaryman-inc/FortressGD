name: "FortressGD build templates"
description: "Build FortressGD export templates (FGD-KDF-1) and cache them."
inputs:
  godot_version:
    description: "Godot version tag without -stable, e.g. 4.6.2"
    required: true
  platforms:
    description: "Comma-separated platforms: linux,windows"
    required: true
    default: "linux"
  secret:
    description: "32-byte project secret as 64 hex chars. Must be an encrypted Actions secret (secrets.*), never a variable or matrix value."
    required: true
  sign_packs:
    description: "true to build the -sig template variant that refuses unsigned packs (match production.sign_packs)"
    required: false
    default: "false"
  scan_paths:
    description: "Extra comma-separated paths (e.g. a source-map directory) to scan for secret material before the job ends"
    required: false
    default: ""
outputs:
  cache_key:
    description: "Cache key prefix fgd-templates-{godot}-{patchset}-{secret_hash}"
    value: ${{ steps.meta.outputs.cache_key }}
  secret_hash:
    description: "16-hex secret_hash (not the secret)"
    value: ${{ steps.meta.outputs.secret_hash }}
runs:
  using: "composite"
  steps:
    # Must stay first: nothing may print before the masks are registered.
    # Masking is defense in depth. The control is the scan step at the end.
    - name: Mask the secret and derived keys
      shell: bash
      env:
        FORTRESSGD_SECRET: ${{ inputs.secret }}
        GODOT_VERSION: ${{ inputs.godot_version }}
      run: |
        set -euo pipefail
        ROOT="${{ github.action_path }}/../.."
        python3 - "$ROOT" "$GODOT_VERSION" <<'PY'
        import os, sys
        sys.path.insert(0, sys.argv[1])
        from fortressgd.core.leakscan import secret_needles
        from fortressgd.core.secret import secret_bytes_from_hex, validate_secret_hex
        from fortressgd.core.templates import concrete_godot_tag
        secret = secret_bytes_from_hex(validate_secret_hex(os.environ["FORTRESSGD_SECRET"]))
        for _label, needle in secret_needles(secret, concrete_godot_tag(sys.argv[2])):
            try:
                text = needle.decode("ascii")
            except UnicodeDecodeError:
                continue
            if text.isalnum():
                print("::add-mask::" + text)
        PY

    - name: Compute cache metadata
      id: meta
      shell: bash
      env:
        FORTRESSGD_SECRET: ${{ inputs.secret }}
        GODOT_VERSION: ${{ inputs.godot_version }}
      run: |
        set -euo pipefail
        ROOT="${{ github.action_path }}/../.."
        META="$(python3 - "$ROOT" "$GODOT_VERSION" <<'PY'
        import os, sys
        sys.path.insert(0, sys.argv[1])
        from fortressgd.core.kdf import secret_hash
        from fortressgd.core.secret import secret_bytes_from_hex, validate_secret_hex
        from fortressgd.core.templates import concrete_godot_tag, patchset_for_tag
        secret = secret_bytes_from_hex(validate_secret_hex(os.environ["FORTRESSGD_SECRET"]))
        godot = concrete_godot_tag(sys.argv[2])
        sh = secret_hash(secret)
        ps = patchset_for_tag(godot)
        print(sh)
        print(ps)
        print(godot)
        PY
        )"
        SECRET_HASH="$(printf '%s\n' "$META" | sed -n '1p')"
        PATCHSET="$(printf '%s\n' "$META" | sed -n '2p')"
        GODOT="$(printf '%s\n' "$META" | sed -n '3p')"
        echo "secret_hash=$SECRET_HASH" >> "$GITHUB_OUTPUT"
        echo "patchset=$PATCHSET" >> "$GITHUB_OUTPUT"
        echo "godot=$GODOT" >> "$GITHUB_OUTPUT"
        echo "cache_key=fgd-templates-${GODOT}-${PATCHSET}-${SECRET_HASH}" >> "$GITHUB_OUTPUT"

    - name: Restore template cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/fortressgd/templates
        key: fgd-templates-${{ steps.meta.outputs.godot }}-${{ steps.meta.outputs.patchset }}-${{ steps.meta.outputs.secret_hash }}-${{ inputs.platforms }}${{ inputs.sign_packs == 'true' && '-sig' || '' }}

    - name: Build templates
      shell: bash
      env:
        FORTRESSGD_SECRET: ${{ inputs.secret }}
      working-directory: ${{ github.action_path }}/../..
      run: |
        set -euo pipefail
        IFS=',' read -r -a PLATS <<< "${{ inputs.platforms }}"
        ARGS=()
        for p in "${PLATS[@]}"; do
          ARGS+=(--platform "$p")
        done
        if [ "${{ inputs.sign_packs }}" = "true" ]; then
          ARGS+=(--require-signature)
        fi
        python3 bin/fortressgd templates build --godot "${{ inputs.godot_version }}" "${ARGS[@]}" 2>&1 \
          | tee "$RUNNER_TEMP/fortressgd-templates-build.log"

    # Runs even when the build failed, before actions/cache saves in its post step
    # (which it skips on a failed job). Deletes any file holding secret material.
    - name: Scan outputs for secret material
      if: always()
      shell: bash
      env:
        FORTRESSGD_SECRET: ${{ inputs.secret }}
        GODOT_VERSION: ${{ inputs.godot_version }}
        SCAN_PATHS: ${{ inputs.scan_paths }}
      working-directory: ${{ github.action_path }}/../..
      run: |
        set -euo pipefail
        PATHS=("$HOME/.cache/fortressgd/templates" "$RUNNER_TEMP/fortressgd-templates-build.log")
        if [ -n "$SCAN_PATHS" ]; then
          IFS=',' read -r -a EXTRA <<< "$SCAN_PATHS"
          PATHS+=("${EXTRA[@]}")
        fi
        python3 -m fortressgd.core.leakscan --godot "$GODOT_VERSION" --delete "${PATHS[@]}"
