name: "FortressGD build templates"
description: "Build FortressGD export templates (FGD-KDF-1) and cache them."
inputs:
  godot_version:
    description: "Godot version tag without -stable, e.g. 4.6.2"
    required: true
  platforms:
    description: "Comma-separated platforms: linux,windows"
    required: true
    default: "linux"
  secret:
    description: "32-byte project secret as 64 hex chars. Must be an encrypted Actions secret (secrets.*), never a variable or matrix value."
    required: true
  sign_packs:
    description: "true to build the -sig template variant that refuses unsigned packs (match production.sign_packs)"
    required: false
    default: "false"
  key_epoch:
    description: "Pack key epoch to build for (match production.key_epoch). 0 is the default key."
    required: false
    default: "0"
  scan_paths:
    description: "Extra comma-separated paths (e.g. a source-map directory) to scan for secret material before the job ends"
    required: false
    default: ""
outputs:
  cache_key:
    description: "Cache key prefix fgd-templates-{godot}-{patchset}-{secret_hash}-g{generator}"
    value: ${{ steps.meta.outputs.cache_key }}
  secret_hash:
    description: "16-hex secret_hash (not the secret)"
    value: ${{ steps.meta.outputs.secret_hash }}
runs:
  using: "composite"
  steps:
    # Must stay first: nothing may print before the masks are registered.
    # Masking is defense in depth. The control is the scan step at the end.
    - name: Mask the secret and derived keys
      shell: bash
      env:
        FORTRESSGD_SECRET: ${{ inputs.secret }}
        GODOT_VERSION: ${{ inputs.godot_version }}
        KEY_EPOCH: ${{ inputs.key_epoch }}
      run: |
        set -euo pipefail
        printf '%s\n' "$KEY_EPOCH" | grep -Eq '^(0|[1-9][0-9]{0,9})$' || { echo "error: key_epoch must be a non-negative integer" >&2; exit 1; }
        ROOT="${{ github.action_path }}/../.."
        python3 - "$ROOT" "$GODOT_VERSION" <<'PY'
        import os, sys
        sys.path.insert(0, sys.argv[1])
        from fortressgd.core.leakscan import secret_needles
        from fortressgd.core.secret import secret_bytes_from_hex, validate_secret_hex
        from fortressgd.core.templates import concrete_godot_tag
        secret = secret_bytes_from_hex(validate_secret_hex(os.environ["FORTRESSGD_SECRET"]))
        epoch = int(os.environ["KEY_EPOCH"])
        for _label, needle in secret_needles(secret, concrete_godot_tag(sys.argv[2]), key_epoch=epoch):
            try:
                text = needle.decode("ascii")
            except UnicodeDecodeError:
                continue
            if text.isalnum():
                print("::add-mask::" + text)
        PY

    - name: Compute cache metadata
      id: meta
      shell: bash
      env:
        FORTRESSGD_SECRET: ${{ inputs.secret }}
        GODOT_VERSION: ${{ inputs.godot_version }}
      run: |
        set -euo pipefail
        ROOT="${{ github.action_path }}/../.."
        META="$(python3 - "$ROOT" "$GODOT_VERSION" <<'PY'
        import os, sys
        sys.path.insert(0, sys.argv[1])
        from fortressgd.core.kdf import secret_hash
        from fortressgd.core.secret import secret_bytes_from_hex, validate_secret_hex
        from fortressgd.core.templates import GENERATOR_SUFFIX, concrete_godot_tag, patchset_for_tag
        secret = secret_bytes_from_hex(validate_secret_hex(os.environ["FORTRESSGD_SECRET"]))
        godot = concrete_godot_tag(sys.argv[2])
        sh = secret_hash(secret)
        ps = patchset_for_tag(godot)
        print(sh)
        print(ps)
        print(godot)
        print(GENERATOR_SUFFIX)
        PY
        )"
        SECRET_HASH="$(printf '%s\n' "$META" | sed -n '1p')"
        PATCHSET="$(printf '%s\n' "$META" | sed -n '2p')"
        GODOT="$(printf '%s\n' "$META" | sed -n '3p')"
        GENERATOR="$(printf '%s\n' "$META" | sed -n '4p')"
        echo "secret_hash=$SECRET_HASH" >> "$GITHUB_OUTPUT"
        echo "patchset=$PATCHSET" >> "$GITHUB_OUTPUT"
        echo "godot=$GODOT" >> "$GITHUB_OUTPUT"
        echo "generator=$GENERATOR" >> "$GITHUB_OUTPUT"
        echo "cache_key=fgd-templates-${GODOT}-${PATCHSET}-${SECRET_HASH}${GENERATOR}" >> "$GITHUB_OUTPUT"

    - name: Restore template cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/fortressgd/templates
        key: fgd-templates-${{ steps.meta.outputs.godot }}-${{ steps.meta.outputs.patchset }}-${{ steps.meta.outputs.secret_hash }}${{ steps.meta.outputs.generator }}-${{ inputs.platforms }}-e${{ inputs.key_epoch }}${{ inputs.sign_packs == 'true' && '-sig' || '' }}

    # A release's build image digests ship in its wheel and as a release asset,
    # not in the git tag this action runs from (DESIGN.md §18.4). At a release
    # tag, fetch the asset, check that this repository's release workflow attested
    # it for that tag, and put it where the CLI looks. On any other ref, templates
    # build compiles the build image on the runner instead, which takes far longer.
    - name: Fetch the release's pinned build images
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPO: ${{ github.action_repository }}
      working-directory: ${{ github.action_path }}/../..
      run: |
        set -euo pipefail
        semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
        tag="" sha=""
        if printf '%s\n' "$ACTION_REF" | grep -Eq "$semver"; then
          tag="$ACTION_REF"
        elif printf '%s\n' "$ACTION_REF" | grep -Eq '^[0-9a-f]{40}$'; then
          # Pinned by commit SHA: use the release tag on that commit, if any.
          sha="$ACTION_REF"
          tag="$(gh api --paginate "repos/$ACTION_REPO/tags" --jq ".[] | select(.commit.sha == \"$sha\") | .name" \
            | grep -E "$semver" | head -n 1 || true)"
        fi
        if [ -z "$tag" ]; then
          echo "::notice::build-templates@$ACTION_REF is not a release; the build image is compiled on this runner"
          exit 0
        fi
        dir="$RUNNER_TEMP/fortressgd-pins"
        mkdir -p "$dir"
        if ! gh release download "$tag" --repo "$ACTION_REPO" --pattern images.lock.json --dir "$dir" --clobber; then
          echo "::notice::release $tag has no images.lock.json; the build image is compiled on this runner"
          exit 0
        fi
        verify=(--repo "$ACTION_REPO" --signer-workflow "$ACTION_REPO/.github/workflows/release.yml"
          --source-ref "refs/tags/$tag" --deny-self-hosted-runners)
        if [ -n "$sha" ]; then
          verify+=(--source-digest "$sha")
        fi
        gh attestation verify "$dir/images.lock.json" "${verify[@]}"
        cp "$dir/images.lock.json" fortressgd/images.lock.json
        echo "Pinned build images from release $tag" >> "$GITHUB_STEP_SUMMARY"

    - name: Build templates
      shell: bash
      env:
        FORTRESSGD_SECRET: ${{ inputs.secret }}
        KEY_EPOCH: ${{ inputs.key_epoch }}
      working-directory: ${{ github.action_path }}/../..
      run: |
        set -euo pipefail
        IFS=',' read -r -a PLATS <<< "${{ inputs.platforms }}"
        ARGS=()
        for p in "${PLATS[@]}"; do
          ARGS+=(--platform "$p")
        done
        if [ "${{ inputs.sign_packs }}" = "true" ]; then
          ARGS+=(--require-signature)
        fi
        ARGS+=(--key-epoch "$KEY_EPOCH")
        python3 bin/fortressgd templates build --godot "${{ inputs.godot_version }}" "${ARGS[@]}" 2>&1 \
          | tee "$RUNNER_TEMP/fortressgd-templates-build.log"

    # Runs even when the build failed, before actions/cache saves in its post step
    # (which it skips on a failed job). Deletes any file holding secret material.
    - name: Scan outputs for secret material
      if: always()
      shell: bash
      env:
        FORTRESSGD_SECRET: ${{ inputs.secret }}
        GODOT_VERSION: ${{ inputs.godot_version }}
        KEY_EPOCH: ${{ inputs.key_epoch }}
        SCAN_PATHS: ${{ inputs.scan_paths }}
      working-directory: ${{ github.action_path }}/../..
      run: |
        set -euo pipefail
        PATHS=("$HOME/.cache/fortressgd/templates" "$RUNNER_TEMP/fortressgd-templates-build.log")
        if [ -n "$SCAN_PATHS" ]; then
          IFS=',' read -r -a EXTRA <<< "$SCAN_PATHS"
          PATHS+=("${EXTRA[@]}")
        fi
        python3 -m fortressgd.core.leakscan --godot "$GODOT_VERSION" --key-epoch "$KEY_EPOCH" --delete "${PATHS[@]}"
