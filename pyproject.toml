[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fortressgd"
version = "0.1.0"
description = "Release toolchain for Godot 4"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Salaryman" }]

[project.scripts]
fortressgd = "cli.main:main"

[project.optional-dependencies]
dev = []
# Optional: AES through OpenSSL (~1000x faster pack decryption/encryption).
# Without it FortressGD uses its pure-Python AES and needs no dependencies.
fast = ["cryptography>=3.1"]

[tool.setuptools.packages.find]
include = ["cli*", "core*", "generator*"]

[tool.setuptools.package-data]
"core" = []
