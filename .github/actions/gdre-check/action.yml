name: "GDRE Tools cannot recover the pack"
description: "Run the latest GDRE Tools release against a protected pack, after a control run on a plain pack. Fails if any script contents come back."
inputs:
  pack:
    description: "Absolute path to the protected .pck"
    required: true
  label:
    description: "What the pack is, for the job summary"
    required: true
  marker:
    description: "Text from the project's scripts that must not be recovered"
    required: false
    default: "FortressGD sample project"
runs:
  using: "composite"
  steps:
    # GDRE Tools (gdsdecomp) is the stock one-click recovery tool. Run its latest
    # release so a new version that breaks FortressGD shows up here. The control
    # run on a plain pack proves the tool works on this runner, so its failure on
    # the protected build means something.
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PACK: ${{ inputs.pack }}
        LABEL: ${{ inputs.label }}
        MARKER: ${{ inputs.marker }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        set -euo pipefail
        [ -f "$PACK" ] || { echo "error: no pack at $PACK" >&2; exit 1; }
        gdre="$(mktemp -d "$RUNNER_TEMP/gdre.XXXXXX")"
        curl -sSLf --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" \
          -o "$gdre/release.json" https://api.github.com/repos/GDRETools/gdsdecomp/releases/latest
        read -r tag url digest < <(python3 - "$gdre/release.json" <<'PY'
        import json, sys
        rel = json.load(open(sys.argv[1]))
        tag = rel["tag_name"]
        asset = next(a for a in rel["assets"] if a["name"] == "GDRE_tools-{0}-linux.zip".format(tag))
        print(tag, asset["browser_download_url"], asset.get("digest") or "none")
        PY
        )
        echo "GDRE Tools $tag"
        curl -sSLf --retry 6 --retry-all-errors -o "$gdre/gdre.zip" "$url"
        if [ "$digest" != "none" ]; then
          echo "${digest#sha256:}  $gdre/gdre.zip" | sha256sum -c -
        fi
        unzip -q "$gdre/gdre.zip" -d "$gdre/bin"
        tool="$gdre/bin/gdre_tools.x86_64"
        chmod +x "$tool"

        # Control: a plain pack GDRE must list.
        python3 - "$gdre/control.pck" <<'PY'
        import os, sys
        sys.path.insert(0, os.environ["WORKSPACE"])
        from tests.gdpc_fixture import make_gdpc
        open(sys.argv[1], "wb").write(make_gdpc(["control_marker.txt"], contents={"control_marker.txt": b"control"}))
        PY
        control="$(timeout 300 "$tool" --headless --list-files="$gdre/control.pck" 2>&1 || true)"
        printf '%s\n' "$control" | tail -20
        printf '%s\n' "$control" | grep -q "control_marker.txt" || { echo "error: GDRE could not read a plain pack; the check below would prove nothing" >&2; exit 1; }

        # The protected build: no key, so nothing may come back.
        set +e
        timeout 900 "$tool" --headless --recover="$PACK" --output="$gdre/recovered" > "$gdre/recover.log" 2>&1
        code=$?
        set -e
        tail -40 "$gdre/recover.log"
        echo "GDRE exit code: $code"
        if grep -rqsF "$MARKER" "$gdre/recovered"; then
          echo "error: GDRE $tag recovered script contents from $LABEL" >&2
          exit 1
        fi
        echo "### GDRE Tools $tag: no script contents recovered from $LABEL (exit $code)" >> "$GITHUB_STEP_SUMMARY"
