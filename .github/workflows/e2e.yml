name: End-to-end

# Builds real templates in Docker, exports the sample project with the official
# editor, verifies the artifacts, runs the exported game, and runs the pinned
# KeyDot against the protected Windows build. It compiles Godot, so it runs
# weekly, on demand, and when the engine-facing parts change on main.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths:
      - "fortressgd/patches/**"
      - "fortressgd/docker/**"
      - "fortressgd/generator/**"
      - "fortressgd/core/export.py"
      - "fortressgd/core/templates.py"
      - "testdata/**"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Templates, export, verify (Godot ${{ matrix.godot }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.6.2", "4.7.2"]
    env:
      PROJ: ${{ github.workspace }}/../proj
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install ".[fast]"

      - name: Prepare the sample project
        run: |
          set -euo pipefail
          cp -r testdata/sample_project "$PROJ"
          cp testdata/e2e/export_presets.cfg "$PROJ/"
          cd "$PROJ"
          fortressgd init
          # Derived key + mangling with the official editor. The dialect path
          # needs a patched headless editor and is not covered here.
          sed -i 's/^godot = .*/godot = "${{ matrix.godot }}"/; s/^dialect = true/dialect = false/' .fortressgd.toml
          # A throwaway secret that exists only for this run.
          fortressgd secret generate
          fortressgd doctor

      - name: Build templates in Docker (linux, windows)
        working-directory: ${{ env.PROJ }}
        run: fortressgd templates build --godot "${{ matrix.godot }}" --platform linux --platform windows

      - name: Get the official Godot editor
        id: godot
        uses: ./.github/actions/godot-editor
        with:
          version: ${{ matrix.godot }}
      - run: echo "FORTRESSGD_GODOT=${{ steps.godot.outputs.path }}" >> "$GITHUB_ENV"

      - name: Export and verify
        working-directory: ${{ env.PROJ }}
        run: |
          set -euo pipefail
          "$FORTRESSGD_GODOT" --headless --path . --import
          cp export_presets.cfg "$RUNNER_TEMP/presets.before"
          # verify_on_export is on, so each export also runs verify and exits 2 on a leak.
          fortressgd export --preset Linux
          fortressgd export --preset Windows
          fortressgd verify build/linux/game.pck
          fortressgd verify build/windows/game.pck
          # export restores export_presets.cfg, so the derived key is never left on disk.
          git diff --no-index --exit-code "$RUNNER_TEMP/presets.before" export_presets.cfg

      - name: The protected Linux build runs
        working-directory: ${{ env.PROJ }}
        run: |
          set -euo pipefail
          out="$(timeout 120 ./build/linux/game.x86_64 --headless --quit-after 30 2>&1 || true)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q "FortressGD sample project"

      # GDRE Tools (gdsdecomp) is the stock one-click recovery tool. Run its latest
      # release so a new version that breaks FortressGD shows up here. The control
      # run on a plain pack proves the tool works on this runner, so its failure on
      # the protected build means something.
      - name: GDRE Tools (latest) cannot recover the protected build
        working-directory: ${{ env.PROJ }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gdre="$RUNNER_TEMP/gdre"
          mkdir -p "$gdre"
          curl -sSLf --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" \
            -o "$gdre/release.json" https://api.github.com/repos/GDRETools/gdsdecomp/releases/latest
          read -r tag url digest < <(python3 - "$gdre/release.json" <<'PY'
          import json, sys
          rel = json.load(open(sys.argv[1]))
          tag = rel["tag_name"]
          asset = next(a for a in rel["assets"] if a["name"] == "GDRE_tools-{0}-linux.zip".format(tag))
          print(tag, asset["browser_download_url"], asset.get("digest") or "none")
          PY
          )
          echo "GDRE Tools $tag"
          curl -sSLf --retry 6 --retry-all-errors -o "$gdre/gdre.zip" "$url"
          if [ "$digest" != "none" ]; then
            echo "${digest#sha256:}  $gdre/gdre.zip" | sha256sum -c -
          fi
          unzip -q "$gdre/gdre.zip" -d "$gdre/bin"
          tool="$gdre/bin/gdre_tools.x86_64"
          chmod +x "$tool"

          # Control: a plain pack GDRE must list.
          python3 - "$gdre/control.pck" <<'PY'
          import sys
          sys.path.insert(0, "${{ github.workspace }}")
          from tests.gdpc_fixture import make_gdpc
          open(sys.argv[1], "wb").write(make_gdpc(["control_marker.txt"], contents={"control_marker.txt": b"control"}))
          PY
          control="$(timeout 300 "$tool" --headless --list-files="$gdre/control.pck" 2>&1 || true)"
          printf '%s\n' "$control" | tail -20
          printf '%s\n' "$control" | grep -q "control_marker.txt" || { echo "error: GDRE could not read a plain pack; the check below would prove nothing" >&2; exit 1; }

          # The protected build: no key, so nothing may come back.
          set +e
          timeout 900 "$tool" --headless --recover="$PWD/build/linux/game.pck" --output="$gdre/recovered" > "$gdre/recover.log" 2>&1
          code=$?
          set -e
          tail -40 "$gdre/recover.log"
          echo "GDRE exit code: $code"
          if grep -rqs "FortressGD sample project" "$gdre/recovered"; then
            echo "error: GDRE $tag recovered script contents from the protected build" >&2
            exit 1
          fi
          echo "### GDRE Tools $tag: no script contents recovered (exit $code)" >> "$GITHUB_STEP_SUMMARY"

      # sign_packs: the -sig template must run a signed pack and refuse an unsigned
      # pack or one whose signature does not verify.
      - name: Signed packs (sign_packs) on Linux
        working-directory: ${{ env.PROJ }}
        run: |
          set -euo pipefail
          cp build/linux/game.pck "$RUNNER_TEMP/unsigned.pck"
          sed -i 's/^sign_packs = false/sign_packs = true/' .fortressgd.toml
          grep -q '^sign_packs = true' .fortressgd.toml
          fortressgd templates build --godot "${{ matrix.godot }}" --platform linux
          # export signs the pack; verify_on_export then checks the signature.
          fortressgd export --preset Linux
          fortressgd verify build/linux/game.pck
          run_game() { timeout 120 ./build/linux/game.x86_64 --headless --quit-after 30 "$@" 2>&1 || true; }
          expect_refused() {
            out="$(run_game --main-pack "$1")"
            printf '%s\n' "$out"
            if printf '%s\n' "$out" | grep -q "FortressGD sample project"; then
              echo "error: the -sig template ran $2" >&2
              exit 1
            fi
            printf '%s\n' "$out" | grep -qi "signature" || { echo "error: no signature error for $2" >&2; exit 1; }
          }
          out="$(run_game)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q "FortressGD sample project"
          expect_refused "$RUNNER_TEMP/unsigned.pck" "an unsigned pack"
          # Corrupt the signature (64 bytes from header offset 40).
          cp build/linux/game.pck "$RUNNER_TEMP/tampered.pck"
          python3 - "$RUNNER_TEMP/tampered.pck" <<'PY'
          import sys
          path = sys.argv[1]
          data = bytearray(open(path, "rb").read())
          data[40] ^= 0x01
          open(path, "wb").write(data)
          PY
          expect_refused "$RUNNER_TEMP/tampered.pck" "a pack with a corrupted signature"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protected-windows-${{ matrix.godot }}
          path: ${{ env.PROJ }}/build/windows/
          if-no-files-found: error
          retention-days: 3

  keydot:
    name: KeyDot regression (Godot ${{ matrix.godot }})
    needs: export
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.6.2", "4.7.2"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: protected-windows-${{ matrix.godot }}
          path: protected
      - name: Download the pinned KeyDot
        shell: bash
        run: |
          set -euo pipefail
          url="$(python -c "import json; print(next(t['download'] for t in json.load(open('testdata/fixtures/unpackers.lock.json'))['tools'] if t['name'] == 'KeyDot'))")"
          curl -sSLf --retry 6 --retry-all-errors -o "$RUNNER_TEMP/keydot.exe" "$url"
      - name: KeyDot must not recover the key
        shell: bash
        env:
          FORTRESSGD_UNPACKER_TESTS: "1"
        run: |
          set -euo pipefail
          export FORTRESSGD_KEYDOT="$RUNNER_TEMP/keydot.exe"
          export FORTRESSGD_PROTECTED_EXE="$GITHUB_WORKSPACE/protected/game.exe"
          export FORTRESSGD_KEYDOT_LOG="$RUNNER_TEMP/keydot.log"
          # The test checks the binary against the pinned sha256 before running it.
          python -m unittest -v tests.test_unpackers 2>&1 | tee "$RUNNER_TEMP/unpackers.log"
          if grep -q "skipped" "$RUNNER_TEMP/unpackers.log"; then
            echo "error: the KeyDot test was skipped" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/keydot.log"
