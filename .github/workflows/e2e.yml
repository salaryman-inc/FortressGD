name: End-to-end

# Builds real templates in Docker, exports the sample project with the official
# editor, verifies the artifacts, runs the exported game, and runs the pinned
# KeyDot against the protected Windows build. It compiles Godot, so it runs
# weekly, on demand, and when the engine-facing parts change on main.
#
# Every Godot build is its own job, so they run in parallel: prepare makes the
# project and secret, the build jobs upload what they compile, and the test jobs
# download it into the template cache. A run takes about as long as its slowest
# build. The toolchain image every build job needs comes from the Actions cache
# (.github/actions/toolchain-image), which prepare fills.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths:
      - "fortressgd/patches/**"
      - "fortressgd/docker/**"
      - "fortressgd/generator/**"
      - "fortressgd/core/export.py"
      - "fortressgd/core/pack_dialect.py"
      - "fortressgd/core/templates.py"
      - "testdata/**"
      - "tests/cross_build.py"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One sample project and one throwaway secret per Godot version, shared by every
  # job of this run: the secret is part of each template's name and key. The
  # artifact is public like the run, and the secret exists only for this run.
  prepare:
    name: Prepare the sample project (Godot ${{ matrix.godot }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.6.2", "4.7.2"]
    env:
      PROJ: ${{ github.workspace }}/../proj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install ".[fast]"
      # One matrix job fills the cache, so two jobs never write it at once. The
      # build jobs wait for both prepare jobs.
      - if: matrix.godot == '4.7.2'
        uses: ./.github/actions/toolchain-image
        with:
          mode: fill
      - name: Create the sample project and its secret
        run: |
          set -euo pipefail
          cp -r testdata/sample_project "$PROJ"
          cp testdata/e2e/export_presets.cfg "$PROJ/"
          cd "$PROJ"
          fortressgd init
          sed -i 's/^godot = .*/godot = "${{ matrix.godot }}"/' .fortressgd.toml
          fortressgd secret generate
          tar -C "$(dirname "$PROJ")" -cf "$RUNNER_TEMP/project.tar" proj
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-${{ matrix.godot }}
          path: ${{ runner.temp }}/project.tar
          if-no-files-found: error
          retention-days: 1

  # dialect = false: the derived key and mangling, exported with the official editor.
  stock-templates:
    name: Build the ${{ matrix.target }} template (Godot ${{ matrix.godot }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.6.2", "4.7.2"]
        target: [linux, windows, linux-sig]
    env:
      PROJ: ${{ github.workspace }}/../proj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/e2e-project
        with:
          godot: ${{ matrix.godot }}
          dialect: "false"
          sign-packs: ${{ matrix.target == 'linux-sig' && 'true' || 'false' }}
      - uses: ./.github/actions/toolchain-image
        with:
          mode: load
      - name: Build the template in Docker
        working-directory: ${{ env.PROJ }}
        run: fortressgd templates build --godot "${{ matrix.godot }}" --platform "${{ matrix.target == 'windows' && 'windows' || 'linux' }}"
      # tar keeps file modes, which artifacts drop.
      - name: Pack the built template
        run: tar -C "$HOME/.cache/fortressgd" -cf "$RUNNER_TEMP/built-${{ matrix.target }}.tar" templates
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stock-${{ matrix.godot }}-${{ matrix.target }}
          path: ${{ runner.temp }}/built-${{ matrix.target }}.tar
          if-no-files-found: error
          retention-days: 1

  # The shared export editor (DESIGN.md §18.5). It holds nothing project-specific.
  editor:
    name: Build the shared editor (Godot ${{ matrix.godot }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.6.2", "4.7.2"]
    env:
      PROJ: ${{ github.workspace }}/../proj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/e2e-project
        with:
          godot: ${{ matrix.godot }}
          dialect: "true"
      - uses: ./.github/actions/toolchain-image
        with:
          mode: load
      - name: Build the shared editor in Docker
        working-directory: ${{ env.PROJ }}
        run: fortressgd templates build --editor --godot "${{ matrix.godot }}"
      # tar keeps file modes, which artifacts drop.
      - name: Pack the built editor
        run: tar -C "$HOME/.cache/fortressgd" -cf "$RUNNER_TEMP/built-editor.tar" templates
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dialect-${{ matrix.godot }}-editor
          path: ${{ runner.temp }}/built-editor.tar
          if-no-files-found: error
          retention-days: 1

  # A dialect template takes the build image path (DESIGN.md §18.4): the first
  # build compiles the image, then relinks this project's template in it.
  dialect-template:
    name: Build the dialect Linux template (Godot ${{ matrix.godot }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.6.2", "4.7.2"]
        include:
          # Goal 2 of #51 is measured on one Godot version; both relink alike.
          - godot: "4.7.2"
            measure_relink: true
    env:
      PROJ: ${{ github.workspace }}/../proj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/e2e-project
        with:
          godot: ${{ matrix.godot }}
          dialect: "true"
      - uses: ./.github/actions/toolchain-image
        with:
          mode: load
      - name: Build the template (build image, then relink)
        working-directory: ${{ env.PROJ }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          fortressgd templates build --godot "${{ matrix.godot }}" --platform linux
          secs=$(( $(date +%s) - start ))
          echo "Godot ${{ matrix.godot }} Linux: cold template build (build image + relink) took ${secs}s" | tee -a "$GITHUB_STEP_SUMMARY"
      # tar keeps file modes, which artifacts drop.
      - name: Pack the built template
        run: tar -C "$HOME/.cache/fortressgd" -cf "$RUNNER_TEMP/built-linux.tar" templates
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dialect-${{ matrix.godot }}-linux
          path: ${{ runner.temp }}/built-linux.tar
          if-no-files-found: error
          retention-days: 1

      # After the upload, so the test job never sees this second template. With the
      # build image built, another project's template recompiles fortressgd_gen.cpp
      # and relinks.
      - name: Warm relink of a second project's template
        if: matrix.measure_relink
        working-directory: ${{ env.PROJ }}
        run: |
          set -euo pipefail
          fortressgd secret generate --secret-file "$RUNNER_TEMP/second.secret"
          start=$(date +%s)
          fortressgd templates build --godot "${{ matrix.godot }}" --platform linux --secret-file "$RUNNER_TEMP/second.secret"
          secs=$(( $(date +%s) - start ))
          echo "Godot ${{ matrix.godot }} Linux: warm relink for a second project took ${secs}s (goal: under 600s)" | tee -a "$GITHUB_STEP_SUMMARY"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep '^fortressgd-build:' | tee -a "$GITHUB_STEP_SUMMARY"

      # DESIGN.md §18.7: build A (this project), B (the second secret) and A at
      # epoch 1. A reference extractor written from A's generated source must
      # recover A's key from A and fail on the other two, and A's key code must
      # share no run of more than 16 instructions with theirs (addresses masked).
      - name: Warm relink of the same project at epoch 1
        if: matrix.measure_relink
        working-directory: ${{ env.PROJ }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          fortressgd templates build --godot "${{ matrix.godot }}" --platform linux --key-epoch 1
          secs=$(( $(date +%s) - start ))
          echo "Godot ${{ matrix.godot }} Linux: warm relink at key_epoch 1 took ${secs}s (goal: under 600s)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Cross-build check
        if: matrix.measure_relink
        env:
          GODOT: ${{ matrix.godot }}
        run: |
          set -euo pipefail
          template() {
            # The cached Linux template for a secret file and epoch suffix ("" or "-e1").
            sh="$(python3 -c 'import sys; from fortressgd.core.kdf import secret_hash; from fortressgd.core.secret import read_secret_file, secret_bytes_from_hex; from pathlib import Path; print(secret_hash(secret_bytes_from_hex(read_secret_file(Path(sys.argv[1])))))' "$1")"
            find "$HOME/.cache/fortressgd/templates" -maxdepth 1 -name "godot-$GODOT-template_release-linux-x86_64-*-$sh-g2$2" ! -name '*.manifest.json' | grep . | head -n 1
          }
          a="$(template "$PROJ/.fortressgd.secret" "")"
          b="$(template "$RUNNER_TEMP/second.secret" "")"
          a1="$(template "$PROJ/.fortressgd.secret" "-e1")"
          python -m tests.cross_build --godot "$GODOT" --max-shared 16 --summary "$GITHUB_STEP_SUMMARY" \
            --a "template=$a,secret=$PROJ/.fortressgd.secret" \
            --other "template=$b,secret=$RUNNER_TEMP/second.secret" \
            --other "template=$a1,secret=$PROJ/.fortressgd.secret,epoch=1"

  export:
    name: Templates, export, verify (Godot ${{ matrix.godot }})
    needs: stock-templates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.6.2", "4.7.2"]
    env:
      PROJ: ${{ github.workspace }}/../proj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Derived key + mangling with the official editor.
      - uses: ./.github/actions/e2e-project
        with:
          godot: ${{ matrix.godot }}
          dialect: "false"
          templates: stock-${{ matrix.godot }}-*

      - name: Get the official Godot editor
        id: godot
        uses: ./.github/actions/godot-editor
        with:
          version: ${{ matrix.godot }}
      - run: echo "FORTRESSGD_GODOT=${{ steps.godot.outputs.path }}" >> "$GITHUB_ENV"

      - name: Export and verify
        working-directory: ${{ env.PROJ }}
        run: |
          set -euo pipefail
          "$FORTRESSGD_GODOT" --headless --path . --import
          cp export_presets.cfg "$RUNNER_TEMP/presets.before"
          # verify_on_export is on, so each export also runs verify and exits 2 on a leak.
          fortressgd export --preset Linux
          fortressgd export --preset Windows
          fortressgd verify build/linux/game.pck
          fortressgd verify build/windows/game.pck
          # export restores export_presets.cfg, so the derived key is never left on disk.
          git diff --no-index --exit-code "$RUNNER_TEMP/presets.before" export_presets.cfg

      - name: The protected Linux build runs
        working-directory: ${{ env.PROJ }}
        run: |
          set -euo pipefail
          out="$(timeout 120 ./build/linux/game.x86_64 --headless --quit-after 30 2>&1 || true)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q "FortressGD sample project"

      # GDRE Tools (latest) against the derived-key build (.github/actions/gdre-check).
      - name: GDRE Tools (latest) cannot recover the protected build
        uses: ./.github/actions/gdre-check
        with:
          pack: ${{ env.PROJ }}/build/linux/game.pck
          label: the derived-key Linux build (Godot ${{ matrix.godot }})

      # sign_packs: the -sig template must run a signed pack and refuse an unsigned
      # pack or one whose signature does not verify.
      - name: Signed packs (sign_packs) on Linux
        working-directory: ${{ env.PROJ }}
        run: |
          set -euo pipefail
          cp build/linux/game.pck "$RUNNER_TEMP/unsigned.pck"
          sed -i 's/^sign_packs = false/sign_packs = true/' .fortressgd.toml
          grep -q '^sign_packs = true' .fortressgd.toml
          # export signs the pack; verify_on_export then checks the signature.
          fortressgd export --preset Linux
          fortressgd verify build/linux/game.pck
          run_game() { timeout 120 ./build/linux/game.x86_64 --headless --quit-after 30 2>&1 || true; }
          # Release templates refuse --main-pack (Godot's disable_path_overrides is on
          # by default), so each test pack goes next to a copy of the binary as
          # game.pck, which is where a shipped game looks for it. It runs from that
          # folder so no project.godot is in the working directory. Release templates
          # refuse that fallback anyway (disable_path_overrides); this keeps the test
          # from depending on it.
          run_with_pack() {
            dir="$(mktemp -d "$RUNNER_TEMP/sig.XXXXXX")"
            cp build/linux/game.x86_64 "$dir/game.x86_64"
            cp "$1" "$dir/game.pck"
            (cd "$dir" && timeout 120 ./game.x86_64 --headless --quit-after 30 2>&1) || true
          }
          expect_refused() {
            out="$(run_with_pack "$1")"
            printf '%s\n' "$out"
            if printf '%s\n' "$out" | grep -q "FortressGD sample project"; then
              echo "error: the -sig template ran $2" >&2
              exit 1
            fi
            printf '%s\n' "$out" | grep -qi "signature" || { echo "error: no signature error for $2" >&2; exit 1; }
          }
          out="$(run_game)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q "FortressGD sample project"
          # Control: the signed pack also runs when loaded this way.
          out="$(run_with_pack build/linux/game.pck)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q "FortressGD sample project" || { echo "error: the copied binary did not run the signed pack" >&2; exit 1; }
          expect_refused "$RUNNER_TEMP/unsigned.pck" "an unsigned pack"
          # Corrupt the signature (64 bytes from header offset 40).
          cp build/linux/game.pck "$RUNNER_TEMP/tampered.pck"
          python3 - "$RUNNER_TEMP/tampered.pck" <<'PY'
          import sys
          path = sys.argv[1]
          data = bytearray(open(path, "rb").read())
          data[40] ^= 0x01
          open(path, "wb").write(data)
          PY
          expect_refused "$RUNNER_TEMP/tampered.pck" "a pack with a corrupted signature"

      # upload-artifact refuses paths with "..", which PROJ has. Copy the build out first.
      - name: Stage the protected Windows build
        run: cp -r "$PROJ/build/windows" "$RUNNER_TEMP/protected-windows"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protected-windows-${{ matrix.godot }}
          path: ${{ runner.temp }}/protected-windows/
          if-no-files-found: error
          retention-days: 3

  # dialect = true: the shared export editor (DESIGN.md §18.5) writes the pack with
  # the project's magic and index order, passed in FORTRESSGD_PACK_PARAMS. The
  # official editor is also on FORTRESSGD_GODOT, for the import step, so this
  # also checks that export picks the shared editor over it.
  dialect:
    name: Shared editor, dialect export (Godot ${{ matrix.godot }})
    needs: [editor, dialect-template]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.6.2", "4.7.2"]
    env:
      PROJ: ${{ github.workspace }}/../proj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/e2e-project
        with:
          godot: ${{ matrix.godot }}
          dialect: "true"
          templates: dialect-${{ matrix.godot }}-*

      - name: Get the official Godot editor
        id: godot
        uses: ./.github/actions/godot-editor
        with:
          version: ${{ matrix.godot }}
      - run: echo "FORTRESSGD_GODOT=${{ steps.godot.outputs.path }}" >> "$GITHUB_ENV"

      - name: Export and verify
        working-directory: ${{ env.PROJ }}
        run: |
          set -euo pipefail
          "$FORTRESSGD_GODOT" --headless --path . --import
          # export fails unless the pack has the project's dialect magic, and
          # verify_on_export reads it with the dialect values.
          fortressgd export --preset Linux
          fortressgd verify build/linux/game.pck
          python3 - build/linux/game.pck <<'PY'
          import sys
          from fortressgd.core.pack import find_gdpc_offset
          data = open(sys.argv[1], "rb").read()
          if find_gdpc_offset(data) is not None:
              sys.exit("error: the dialect export wrote a stock GDPC pack")
          PY

      # Stock unpackers must fail on the dialect build too (DESIGN.md §18.7).
      - name: GDRE Tools (latest) cannot recover the dialect build
        uses: ./.github/actions/gdre-check
        with:
          pack: ${{ env.PROJ }}/build/linux/game.pck
          label: the dialect Linux build (Godot ${{ matrix.godot }})

      - name: The dialect template runs the dialect pack
        working-directory: ${{ env.PROJ }}
        run: |
          set -euo pipefail
          # --export-pack writes only the pack; the game is the template next to it.
          template="$(find ~/.cache/fortressgd/templates -maxdepth 1 -name 'godot-${{ matrix.godot }}-template_release-linux-x86_64-*' ! -name '*.manifest.json')"
          cp "$template" build/linux/game.x86_64
          chmod +x build/linux/game.x86_64
          out="$(cd build/linux && timeout 120 ./game.x86_64 --headless --quit-after 30 2>&1 || true)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q "FortressGD sample project"

      - name: The shared editor refuses a malformed FORTRESSGD_PACK_PARAMS
        working-directory: ${{ env.PROJ }}
        run: |
          set -euo pipefail
          editor="$(find ~/.cache/fortressgd/templates -maxdepth 1 -name 'godot-${{ matrix.godot }}-editor-linux-x86_64-*' ! -name '*.manifest.json')"
          set +e
          out="$(FORTRESSGD_PACK_PARAMS=1:zzzz:0123 timeout 300 "$editor" --headless --path . --export-pack Linux "$RUNNER_TEMP/bad.pck" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out" | tail -20
          # It exits at startup with status 2, before it opens the project.
          [ "$code" -eq 2 ] || { echo "error: the editor exited $code, not 2" >&2; exit 1; }
          printf '%s\n' "$out" | grep -q "FORTRESSGD_PACK_PARAMS is malformed"
          [ ! -e "$RUNNER_TEMP/bad.pck" ] || { echo "error: the editor wrote a pack anyway" >&2; exit 1; }

  keydot:
    name: KeyDot regression (Godot ${{ matrix.godot }})
    needs: export
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.6.2", "4.7.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: protected-windows-${{ matrix.godot }}
          path: protected
      - name: Download the pinned KeyDot
        shell: bash
        run: |
          set -euo pipefail
          url="$(python -c "import json; print(next(t['download'] for t in json.load(open('testdata/fixtures/unpackers.lock.json'))['tools'] if t['name'] == 'KeyDot'))")"
          curl -sSLf --retry 6 --retry-all-errors -o "$RUNNER_TEMP/keydot.exe" "$url"
      - name: KeyDot must not recover the key
        shell: bash
        env:
          FORTRESSGD_UNPACKER_TESTS: "1"
        run: |
          set -euo pipefail
          export FORTRESSGD_KEYDOT="$RUNNER_TEMP/keydot.exe"
          export FORTRESSGD_PROTECTED_EXE="$GITHUB_WORKSPACE/protected/game.exe"
          export FORTRESSGD_PROTECTED_PCK="$GITHUB_WORKSPACE/protected/game.pck"
          export FORTRESSGD_KEYDOT_LOG="$RUNNER_TEMP/keydot.log"
          # The test checks the binary against the pinned sha256 before running it.
          python -m unittest -v tests.test_unpackers 2>&1 | tee "$RUNNER_TEMP/unpackers.log"
          if grep -q "skipped" "$RUNNER_TEMP/unpackers.log"; then
            echo "error: the KeyDot test was skipped" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/keydot.log"
