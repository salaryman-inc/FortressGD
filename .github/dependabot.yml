version: 2
updates:
  # Workflows and actions pin every action to a commit SHA. Dependabot moves the
  # SHA and its version comment together. The composite actions are listed
  # because "/" only covers .github/workflows.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/e2e-project"
      - "/.github/actions/godot-editor"
      - "/.github/actions/toolchain-image"
      - "/actions/build-templates"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # The docs site (Starlight). Grouped so Astro and Starlight move together.
  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
    commit-message:
      prefix: docs
